  <body>
    <main id="demo">
      <noscript>
        <h1>Jacquard</h1>
        <p>
          An FFGL effect that weaves your clip on a jacquard loom, sticking to
          the loom's own rules instead of laying a cloth texture over the
          picture. One warp colour runs down, each pick across carries one weft
          colour from the shuttles loaded, no thread can float past more
          crossings than Max Float, and tone comes from the weave structure,
          twill in the midtones and satin towards the ends. Every pick's shuttle
          and lift pattern is chosen by an exactly optimal programme under both
          float limits, and the look comes out of that: colour in horizontal
          bands, twill diagonals, ties sprinkled through the solids, and a
          picture from across the room that turns into thread up close.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/jacquard">its repository</a>.
        </p>
